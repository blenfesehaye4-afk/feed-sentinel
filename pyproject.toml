[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-sentinel"
version = "0.2.0"
description = "📡 Feed Sentinel: Automated RSS/Atom ingestion, OPML sync, NLP trend detection & webhook alerting engine."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Blen Fesehaye", email = "blenfesehaye4@gmail.com" }
]
keywords = [
    "rss",
    "atom",
    "opml",
    "nlp",
    "trends",
    "sentiment-analysis",
    "content-curation",
    "webhook-alerts",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: BBS",
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
feed-sentinel = "feed_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["feed_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
